name: Compilar APK Inspector PGSharp
on:
  push:
    branches:
      - inspector-pgsharp-apk
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Preparar Android SDK
        run: |
          export PATH="/usr/local/lib/android/sdk/cmdline-tools/16.0/bin:$PATH"
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compilar instalador APK
        working-directory: inspector-pgsharp
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Renombrar APK
        run: |
          cp inspector-pgsharp/app/build/outputs/apk/debug/app-debug.apk Inspector-PGSharp-PIN-v1.2.apk
          sha256sum Inspector-PGSharp-PIN-v1.2.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Inspector-PGSharp-APK
          path: Inspector-PGSharp-PIN-v1.2.apk
      - name: Publicar enlace directo de instalador
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create inspector-pgsharp-pinfix-v1.2 Inspector-PGSharp-PIN-v1.2.apk --title "Inspector PGSharp PIN v1.2" --target "$GITHUB_SHA" --prerelease --notes "APK de prueba para inspeccionar controles de accesibilidad PGSharp, sin acceso a Internet." ||
          gh release upload inspector-pgsharp-pinfix-v1.2 Inspector-PGSharp-PIN-v1.2.apk --clobber
